name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag existente para compilar (ex.: v0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate release version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tauri = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
          const cargo = fs.readFileSync('src-tauri/Cargo.toml', 'utf8')
            .match(/^version\s*=\s*"([^"]+)"/m)?.[1];
          if (pkg.version !== tauri.version || cargo !== tauri.version ||
              process.env.RELEASE_TAG !== `v${tauri.version}`) {
            throw new Error('A tag e as versões de package.json, Cargo.toml e tauri.conf.json devem coincidir.');
          }
          NODE

      - name: Prepare draft prerelease
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > /tmp/release.json; then
            node -e "if (!require('/tmp/release.json').isDraft) throw new Error('Esta release já foi publicada; use uma nova versão.');"
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "Game Dev Hub $RELEASE_TAG" \
              --notes "Versão de teste. Baixe o instalador correspondente ao seu sistema nos assets abaixo. Os aplicativos não possuem assinatura digital; Windows e macOS podem exibir avisos ou bloquear a execução."
          fi
          release_id="$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.id')"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --locked --bundles nsis,msi
          - platform: macos-latest
            args: --locked --target universal-apple-darwin --bundles dmg
          - platform: ubuntu-22.04
            args: --locked --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - name: Set up Rust
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install macOS targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@f650639e43adf15f35dd1023d248b3ecc3568b64 # v0.6.1
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          args: ${{ matrix.args }}
          includeUpdaterJson: false

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish completed prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
